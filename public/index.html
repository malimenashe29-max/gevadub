<!doctype html>
<html lang="he" dir="rtl" data-intro="play">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161718">
  <meta name="description" content="GevaDub: שיר אחד, כל החבר'ה. כל אחד מקליט את החלק שלו מהבית, ואף אחד לא שומע את השאר עד הפרמיירה.">
  <title>GevaDub</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Same rule as the studio site: the card plays once per visit, and not at all for reduced motion.
    try {
      if (sessionStorage.getItem('gevadub:intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.removeAttribute('data-intro');
      }
      sessionStorage.setItem('gevadub:intro', '1');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="studio-intro" id="intro" aria-hidden="true">
    <div class="studio-mark">
      <span class="studio-word" id="intro-word"></span>
      <span class="studio-rule"></span>
    </div>
    <span class="studio-skip">לחיצה או מקש כלשהו כדי לדלג</span>
  </div>

  <header class="top">
    <a class="brand" href="/" data-link>
      <span class="brand-g">Geva</span><span class="brand-d">Dub</span>
    </a>
    <nav class="top-nav">
      <a href="/new" data-link class="nav-cta">דאב חדש</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    <span>GevaDub</span>
    <span class="dot">·</span>
    <a href="https://www.gevastudio.com" target="_blank" rel="noopener">GevaStudio</a>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
